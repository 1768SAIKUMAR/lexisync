# docker compose up --build      -> http://localhost:8501
# first time only: docker compose exec ollama ollama pull qwen2.5:7b
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  app:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_HOST_URL: http://ollama:11434
    ports: ["8501:8501"]
    volumes:
      - ./data:/app/data          # your PDFs, cases and index cache
      - ./reports:/app/reports    # evaluation results
volumes:
  ollama:
