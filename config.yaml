# LexiSync configuration. Every threshold used anywhere lives here.
seed: 42

paths:
  docs_dir: data/docs
  index_dir: data/index
  reports_dir: reports

ingest:
  header_footer_band: 0.08      # top/bottom fraction of page height
  header_repeat_ratio: 0.40     # line must repeat on >= this share of pages
  footnote_font_ratio: 0.90     # font < ratio * median body font
  footnote_min_y_ratio: 0.60    # footnote must start below this fraction of page height
  scanned_max_chars: 40         # fewer text chars than this ...
  scanned_min_image_cover: 0.50 # ... and images cover more than this -> scanned
  ocr_dpi: 200
  column_max_width_ratio: 0.55  # a block narrower than this can be a column block
  min_column_pairs: 2           # side-by-side pairs needed to call a page two-column

retrieval:
  offline: false                # true (or LEXISYNC_OFFLINE=1) = stand-in models
  embed_model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60                     # Reciprocal Rank Fusion constant
  candidates: 30                # fused candidates sent to the reranker
  top_k: 6                      # passages given to the LLM (best in evaluation: k=6 > k=4)

llm:
  backend: ollama               # ollama | openai | mock   (env LEXISYNC_LLM overrides)
  ollama_model: qwen2.5:7b      # use qwen2.5:3b on an 8 GB Mac
  ollama_host: http://localhost:11434
  num_ctx: 8192
  max_tokens: 1024              # cap per answer (stops runaway JSON generation)
  timeout_s: 180
  openai_model: gpt-4o-mini
  openai_base_url: https://api.openai.com/v1

answer:
  abstain_threshold: 0.10       # best rerank relevance below this -> abstain, no LLM call
  high_relevance: 0.70          # needed (with all claims verified) for HIGH confidence
  low_relevance: 0.30           # below this -> LOW confidence
  fuzzy_min: 85                 # rapidfuzz partial_ratio for a quote to count as found
  overlap_min: 0.60             # ...or share of quote words present in the passage
  quote_min_words: 5
  quote_max_words: 25
  max_attempts: 2               # verifier retries (reformulate, retrieve, regenerate)

doc_names:                      # display names used in citation labels
  gdpr: GDPR
  eprivacy: ePrivacy
  basic_law: Basic Law
  ai_act: AI Act
