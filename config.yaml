# LexiSync configuration. Every threshold used anywhere lives here.
seed: 42

paths:
  docs_dir: data/docs
  index_dir: data/index
  reports_dir: reports

ingest:
  header_footer_band: 0.08      # top/bottom fraction of page height
  header_repeat_ratio: 0.40     # line must repeat on >= this share of pages
  footnote_font_ratio: 0.90     # font < ratio * median body font
  footnote_min_y_ratio: 0.60    # footnote must start below this fraction of page height
  scanned_max_chars: 40         # fewer text chars than this ...
  scanned_min_image_cover: 0.50 # ... and images cover more than this -> scanned
  ocr_dpi: 200
  column_max_width_ratio: 0.55  # a block narrower than this can be a column block
  min_column_pairs: 2           # side-by-side pairs needed to call a page two-column
