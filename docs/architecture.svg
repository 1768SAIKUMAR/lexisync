<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="1030" fill="white"/>
<text x="60" y="60" font-size="32" fill="#222" font-weight="bold" text-anchor="start">LexiSync: evidence-grounded legal document analyst</text>
<text x="60" y="92" font-size="18" fill="#555" text-anchor="start">Every claim cites page + clause, is verified against its source, and the system abstains when the documents lack evidence.</text>
<text x="60" y="140" font-size="17" fill="#0F6E56" font-weight="bold" text-anchor="start">INDEXING  (once per document)</text>
<rect x="60" y="155" width="330" height="150" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
<text x="225.0" y="189" font-size="21" fill="#2C2C2A" font-weight="bold" text-anchor="middle">Documents</text>
<text x="225.0" y="219" font-size="16" fill="#333" text-anchor="middle">2–5 public legal PDFs</text>
<text x="225.0" y="243" font-size="16" fill="#333" text-anchor="middle">GDPR (88 p.), ePrivacy (11 p.,</text>
<text x="225.0" y="267" font-size="16" fill="#333" text-anchor="middle">two-column), any upload / URL</text>
<text x="225.0" y="291" font-size="16" fill="#333" text-anchor="middle">cases = separate document sets</text>
<rect x="440" y="155" width="330" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
<text x="605.0" y="189" font-size="21" fill="#085041" font-weight="bold" text-anchor="middle">1  Ingestion</text>
<text x="605.0" y="219" font-size="16" fill="#333" text-anchor="middle">PyMuPDF dict · NFKC · reading order</text>
<text x="605.0" y="243" font-size="16" fill="#333" text-anchor="middle">2-column bands · header/footer removal</text>
<text x="605.0" y="267" font-size="16" fill="#333" text-anchor="middle">footnotes · tables (find_tables)</text>
<text x="605.0" y="291" font-size="16" fill="#333" text-anchor="middle">scanned → Tesseract OCR 200 dpi</text>
<rect x="820" y="155" width="330" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
<text x="985.0" y="189" font-size="21" fill="#085041" font-weight="bold" text-anchor="middle">2  Clause-aware chunking</text>
<text x="985.0" y="219" font-size="16" fill="#333" text-anchor="middle">EU: Article 83 → 83(5), recitals, 4(11)</text>
<text x="985.0" y="243" font-size="16" fill="#333" text-anchor="middle">contract: 7. Liability → 7.2</text>
<text x="985.0" y="267" font-size="16" fill="#333" text-anchor="middle">merge &lt; 120 chars · split &gt; 1500</text>
<text x="985.0" y="291" font-size="16" fill="#333" text-anchor="middle">label 'GDPR p. 83, Article 83(5)' + bboxes</text>
<rect x="1200" y="155" width="330" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
<text x="1365.0" y="189" font-size="21" fill="#085041" font-weight="bold" text-anchor="middle">3  Index</text>
<text x="1365.0" y="219" font-size="16" fill="#333" text-anchor="middle">BM25 (legal-ref tokenizer: 7.2, 83(5))</text>
<text x="1365.0" y="243" font-size="16" fill="#333" text-anchor="middle">bge-small-en-v1.5 embeddings (384-d)</text>
<text x="1365.0" y="267" font-size="16" fill="#333" text-anchor="middle">fingerprinted pickle cache</text>
<text x="1365.0" y="291" font-size="16" fill="#333" text-anchor="middle">GDPR + ePrivacy: 747 chunks</text>
<path d="M390 230 L438 230" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="438,230 426,237 426,223" fill="#555"/>
<path d="M770 230 L818 230" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="818,230 806,237 806,223" fill="#555"/>
<path d="M1150 230 L1198 230" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="1198,230 1186,237 1186,223" fill="#555"/>
<text x="60" y="400" font-size="17" fill="#534AB7" font-weight="bold" text-anchor="start">ANSWERING  (per question)</text>
<rect x="60" y="415" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="225.0" y="449" font-size="21" fill="#3C3489" font-weight="bold" text-anchor="middle">4  Query planner</text>
<text x="225.0" y="479" font-size="16" fill="#333" text-anchor="middle">splits 'A, and which B?'</text>
<text x="225.0" y="503" font-size="16" fill="#333" text-anchor="middle">vague part inherits topic</text>
<text x="225.0" y="527" font-size="16" fill="#333" text-anchor="middle">each part searched separately</text>
<text x="225.0" y="551" font-size="16" fill="#333" text-anchor="middle">best passage of each part kept</text>
<rect x="440" y="415" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="605.0" y="449" font-size="21" fill="#3C3489" font-weight="bold" text-anchor="middle">5  Hybrid retrieval</text>
<text x="605.0" y="479" font-size="16" fill="#333" text-anchor="middle">BM25 rank + dense rank</text>
<text x="605.0" y="503" font-size="16" fill="#333" text-anchor="middle">Reciprocal Rank Fusion, k = 60</text>
<text x="605.0" y="527" font-size="16" fill="#333" text-anchor="middle">top 30 candidates</text>
<text x="605.0" y="551" font-size="16" fill="#333" text-anchor="middle">(ranks, not raw scores)</text>
<rect x="820" y="415" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="985.0" y="449" font-size="21" fill="#3C3489" font-weight="bold" text-anchor="middle">6  Cross-encoder rerank</text>
<text x="985.0" y="479" font-size="16" fill="#333" text-anchor="middle">ms-marco-MiniLM-L-6-v2</text>
<text x="985.0" y="503" font-size="16" fill="#333" text-anchor="middle">reads query + passage together</text>
<text x="985.0" y="527" font-size="16" fill="#333" text-anchor="middle">sigmoid → relevance 0..1</text>
<text x="985.0" y="551" font-size="16" fill="#333" text-anchor="middle">top k = 4–6 passages</text>
<rect x="1200" y="415" width="330" height="150" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>
<text x="1365.0" y="449" font-size="21" fill="#712B13" font-weight="bold" text-anchor="middle">7  Retrieval gate</text>
<text x="1365.0" y="479" font-size="16" fill="#333" text-anchor="middle">best relevance &lt; 0.10 ?</text>
<text x="1365.0" y="503" font-size="16" fill="#333" text-anchor="middle">→ ABSTAIN, no LLM call</text>
<text x="1365.0" y="527" font-size="16" fill="#333" text-anchor="middle">list documents searched</text>
<text x="1365.0" y="551" font-size="16" fill="#333" text-anchor="middle">(answerable ≥ 0.3, unanswerable ≈ 0)</text>
<path d="M390 490 L438 490" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="438,490 426,497 426,483" fill="#555"/>
<path d="M770 490 L818 490" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="818,490 806,497 806,483" fill="#555"/>
<path d="M1150 490 L1198 490" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="1198,490 1186,497 1186,483" fill="#555"/>
<rect x="60" y="655" width="330" height="150" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
<text x="225.0" y="689" font-size="21" fill="#2C2C2A" font-weight="bold" text-anchor="middle">10  UI (Streamlit)</text>
<text x="225.0" y="719" font-size="16" fill="#333" text-anchor="middle">answer + confidence badge</text>
<text x="225.0" y="743" font-size="16" fill="#333" text-anchor="middle">citation chips · timings</text>
<text x="225.0" y="767" font-size="16" fill="#333" text-anchor="middle">claim verification table</text>
<text x="225.0" y="791" font-size="16" fill="#333" text-anchor="middle">cited PDF page, region highlighted</text>
<rect x="440" y="655" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="605.0" y="689" font-size="21" fill="#3C3489" font-weight="bold" text-anchor="middle">9  Citations &amp; confidence</text>
<text x="605.0" y="719" font-size="16" fill="#333" text-anchor="middle">[C2] → 'GDPR p. 83, Article 83(5)'</text>
<text x="605.0" y="743" font-size="16" fill="#333" text-anchor="middle">only cited, checked sentences shown</text>
<text x="605.0" y="767" font-size="16" fill="#333" text-anchor="middle">HIGH / MEDIUM / LOW /</text>
<text x="605.0" y="791" font-size="16" fill="#333" text-anchor="middle">INSUFFICIENT EVIDENCE</text>
<rect x="820" y="655" width="330" height="150" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>
<text x="985.0" y="689" font-size="21" fill="#712B13" font-weight="bold" text-anchor="middle">8b  Verifier (code)</text>
<text x="985.0" y="719" font-size="16" fill="#333" text-anchor="middle">quote in cited passage: rapidfuzz</text>
<text x="985.0" y="743" font-size="16" fill="#333" text-anchor="middle">partial_ratio ≥ 85 or overlap ≥ 0.6</text>
<text x="985.0" y="767" font-size="16" fill="#333" text-anchor="middle">every number must match (20M ≠ 10M)</text>
<text x="985.0" y="791" font-size="16" fill="#333" text-anchor="middle">fail → reformulate, retry (max 2)</text>
<rect x="1200" y="655" width="330" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="1365.0" y="689" font-size="21" fill="#3C3489" font-weight="bold" text-anchor="middle">8a  LLM: qwen2.5:7b (Ollama)</text>
<text x="1365.0" y="719" font-size="16" fill="#333" text-anchor="middle">temperature 0 · seed 42 · JSON schema</text>
<text x="1365.0" y="743" font-size="16" fill="#333" text-anchor="middle">claims (text, [C#], quote) → answer</text>
<text x="1365.0" y="767" font-size="16" fill="#333" text-anchor="middle">→ missing → abstain (decide last)</text>
<text x="1365.0" y="791" font-size="16" fill="#333" text-anchor="middle">rules: only passages, no swapped numbers</text>
<path d="M1200 730 L1152 730" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="1152,730 1164,723 1164,737" fill="#555"/>
<path d="M820 730 L772 730" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="772,730 784,723 784,737" fill="#555"/>
<path d="M440 730 L392 730" fill="none" stroke="#555" stroke-width="2.5"/><polygon points="392,730 404,723 404,737" fill="#555"/>
<path d="M1365 565 L1365 653" fill="none" stroke="#534AB7" stroke-width="2.5"/><polygon points="1365,653 1358,641 1372,641" fill="#534AB7"/>
<text x="1378" y="615" font-size="15" fill="#3C3489" text-anchor="start">relevance ≥ 0.10</text>
<path d="M1365 305 L1365 362 L605 362 L605 413" fill="none" stroke="#0F6E56" stroke-width="2.5"/><polygon points="605,413 598,401 612,401" fill="#0F6E56"/>
<text x="700" y="354" font-size="15" fill="#0F6E56" text-anchor="start">index used by retrieval</text>
<path d="M920 655 L920 612 L700 612 L700 567" fill="none" stroke="#993C1D" stroke-width="2.5"/><polygon points="700,567 707,579 693,579" fill="#993C1D"/>
<text x="712" y="603" font-size="15" fill="#993C1D" text-anchor="start">failed claim → new query</text>
<rect x="60" y="822" width="1470" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text x="75" y="845" font-size="16" fill="#712B13" text-anchor="start">Abstention: gate (step 7), model says no answer, or no claim survives the verifier  →  INSUFFICIENT EVIDENCE + list of documents searched</text>
<text x="60" y="900" font-size="17" fill="#222" font-weight="bold" text-anchor="start">EVALUATION</text>
<text x="60" y="928" font-size="16" fill="#333" text-anchor="start">20 questions (11 factual, 5 multi-hop incl. 3 cross-document, 4 unanswerable) + held-out set on an unseen document · recall@1/3/5/10 + MRR per retrieval mode</text>
<text x="60" y="954" font-size="16" fill="#333" text-anchor="start">recall@3: BM25 0.61 · dense 0.77 · hybrid 0.71 · +rerank 0.83 · +planner 0.93 (MRR 0.93) · OCR CER 3.2 %</text>
<text x="60" y="980" font-size="16" fill="#333" text-anchor="start">end-to-end correct: closed-book 35 % · dense-only 60 % · full 75 % → 85 % after error analysis, 0 % false refusals · unanswerable abstained 4/4 · held-out Basic Law: 7/8 correct, 3/3 refused</text>
</svg>